<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | PlayCube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <main class="page-layout">
        <aside class="navbar">
            <a class="brand" href="index.html"><img src="./25694.png" alt="PlayCube home"></a>
            <nav aria-label="Main navigation"><ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
                <li><a href="discover.html"><i class="fa-regular fa-compass"></i><span>Discover</span></a></li>
                <li><a href="games.html"><i class="fa-solid fa-gamepad"></i><span>Games</span></a></li>
                <li><a href="contacts.html"><i class="fa-solid fa-users"></i><span>Contacts</span></a></li>
                <li><a href="account.html"><i class="fa-solid fa-user"></i><span>Account</span></a></li>
                <li><a href="more.html"><i class="fa-solid fa-ellipsis"></i><span>More</span></a></li>
            </ul></nav>
            <div class="sidebar-note">MAKE TIME TO PLAY</div>
        </aside>
        <section class="page-content account-page">
            <p class="eyebrow">JOIN THE COMMUNITY</p>
            <h1>Create an account</h1>
            <p class="page-intro">Set up your PlayCube profile and get ready to play.</p>
            <form class="signup-form">
                <label>Username<input required minlength="1" maxlength="35" type="text" name="username" placeholder="Your username"></label>
                <label>Email<input required type="email" name="email" placeholder="you@example.com"></label>
                <label>Password<input required type="password" name="password" placeholder="Create a password"></label>
                <label>Country<input required type="text" name="country" placeholder="Your country"></label>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>
    <script src="playcube.js"></script>
</body>
</html>
